# In .github/workflows/deploy.yml

name: Deploy Service

on:
  push:
    branches:
      - stage
      - main
    paths-ignore: ['**/*.md', 'docs/**']
  # ready_for_review: drafts skip CI, so a PR gets its first run when marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [stage, main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

# PR runs collapse to the newest push. Pushes to stage/main queue per branch and
# are never cancelled: a deploy must not stop halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Sentry release version - uses git SHA for unique identification
  SENTRY_RELEASE: ${{ github.sha }}

jobs:
  test-and-coverage:
    name: Tests & Coverage Report
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/ci.yml

  deploy-staging:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    name: Deploy to Staging
    needs: test-and-coverage
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/stage') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    environment:
      name: staging
      url: https://storybook-deployment-service-preview.epinnock.workers.dev/healthz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Set build timestamp
        id: stamp
        run: echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.99.0'
          command: >-
            deploy --env staging
            --var SCRY_ENV:staging
            --var SCRY_COMMIT:${{ github.sha }}
            --var SCRY_BRANCH:${{ github.ref_name }}
            --var SCRY_BUILD_TIME:${{ steps.stamp.outputs.built_at }}
            --var SCRY_DEPLOY_ID:${{ github.run_id }}
            --var SCRY_ACTOR:${{ github.actor }}
            --var SENTRY_RELEASE:${{ github.sha }}
            --tag ${{ github.sha }}
            --message "${{ github.ref_name }} ${{ github.actor }} run=${{ github.run_id }}"

      - name: Verify deployed commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..6}; do
            if curl -4fsS --connect-timeout 10 --max-time 20 \
              https://storybook-deployment-service-preview.epinnock.workers.dev/healthz \
              | jq -e --arg commit "$EXPECTED_COMMIT" '.commit == $commit' > /dev/null; then
              echo "Staging verified at $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Verification attempt $attempt/6 failed"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::Staging did not report the expected commit $EXPECTED_COMMIT"
          exit 1

  # Job 2: Deploy to Cloudflare Workers
  deploy-worker:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    name: Deploy to Production
    needs: test-and-coverage
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://storybook-deployment-service.epinnock.workers.dev/healthz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: worker-build
          path: dist/

      - name: Set build timestamp
        id: stamp
        run: echo "built_at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.99.0'
          command: >-
            deploy --env production
            --var SCRY_ENV:production
            --var SCRY_COMMIT:${{ github.sha }}
            --var SCRY_BRANCH:${{ github.ref_name }}
            --var SCRY_BUILD_TIME:${{ steps.stamp.outputs.built_at }}
            --var SCRY_DEPLOY_ID:${{ github.run_id }}
            --var SCRY_ACTOR:${{ github.actor }}
            --var SENTRY_RELEASE:${{ github.sha }}
            --tag ${{ github.sha }}
            --message "${{ github.ref_name }} ${{ github.actor }} run=${{ github.run_id }}"

      - name: Verify deployed commit
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in {1..6}; do
            if curl -4fsS --connect-timeout 10 --max-time 20 \
              https://storybook-deployment-service.epinnock.workers.dev/healthz \
              | jq -e --arg commit "$EXPECTED_COMMIT" '.commit == $commit' > /dev/null; then
              echo "Production verified at $EXPECTED_COMMIT"
              exit 0
            fi
            echo "Verification attempt $attempt/6 failed"
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          echo "::error::Production did not report the expected commit $EXPECTED_COMMIT"
          exit 1

      # Upload source maps to Sentry for better error stack traces
      - name: Create Sentry Release and Upload Source Maps
        # Run best-effort; some repos/environments may not have Sentry secrets configured.
        continue-on-error: true
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          version: ${{ env.SENTRY_RELEASE }}
          sourcemaps: './dist'
          # Set commits to associate with this release
          set_commits: auto
          # Finalize the release after upload
          finalize: true

      # Notify Sentry of successful deployment
      - name: Notify Sentry of Deployment
        continue-on-error: true
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ] || [ -z "${SENTRY_ORG}" ]; then
            echo "Sentry secrets not configured; skipping deploy notification."
            exit 0
          fi
          curl -sL https://sentry.io/api/0/organizations/${SENTRY_ORG}/releases/${{ env.SENTRY_RELEASE }}/deploys/ \
            -H "Authorization: Bearer ${SENTRY_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"environment": "production"}' || true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}

      - name: Deployment Summary
        continue-on-error: true
        if: success()
        run: |
          echo "## 🚀 Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Worker:** storybook-deployment-service" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # Job 3: Build and Push Docker Image
  build-and-push-docker:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    name: Build and Push Docker Image
    needs: deploy-worker
    continue-on-error: true
    # Grant permissions for the GITHUB_TOKEN to push to the GitHub Container Registry.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # Pass build arguments for any secrets needed during the build process (if any).
          # secrets: |
          #   "NPM_TOKEN=${{ secrets.NPM_TOKEN }}"
